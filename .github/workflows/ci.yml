name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The root suite includes the release-prepare proof, which
          # derives the release range from real tags — a shallow,
          # tagless checkout makes `git describe` fail.
          fetch-depth: 0

      # The same proof runs `changeset status`, which diffs against the
      # local `main` ref; a PR checkout has only origin/main. Create it
      # when absent — never force-update a checked-out main on push runs.
      - name: Materialize the changesets base ref
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test
