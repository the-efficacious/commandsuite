name: Headless bootstrap

# Brings up the whole ecosystem from a clean checkout with nobody at a
# terminal — broker seeded, web UI reachable and signed into, a runner
# member enrolled through the device-code flow whose credential resolves
# from its working directory with no env token, runner preflight green —
# then a LIVE runner connection, measured: the stub runner (a test/CI
# instrument needing no model credential) starts and the roster shows
# connected=1, a session_start activity event lands, and an addressed DM
# gets the stub's canned self-identifying reply.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Bring the ecosystem up, headless
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-bootstrap
          CSUITE_AUTH_CONFIG_PATH: ${{ runner.temp }}/csuite-bootstrap/auth.json
          CSUITE_PORT: 8719
          CSUITE_RUNNER_VERB: stub
          CSUITE_START_RUNNER: "1"
        run: scripts/bootstrap.sh up </dev/null

      - name: Runner is measurably connected (session_start + canned turn)
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-bootstrap
        run: |
          TOKEN=$(cat "$CSUITE_BOOTSTRAP_DIR/secrets/admin.token")
          URL=http://127.0.0.1:8719
          # The activity uploader batches: connected=1 (step 8) can land
          # before the first batch flushes, so poll rather than read once.
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/members/builder/activity?limit=50" | grep -q '"kind":"session_start"'; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "no session_start activity event within 60s" >&2; exit 1; }
          echo "session_start activity event present"
          curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/roster" | grep -q '"name":"builder"[^}]*"title":"stub runner (CI instrument)"'
          echo "roster title names the stub"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"to":"builder","body":"builder: are you there?"}' "$URL/push" >/dev/null
          for i in $(seq 1 30); do
            if curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/history?limit=6" | grep -q 'stub runner'; then
              echo "canned self-identifying reply observed"; exit 0
            fi
            sleep 2
          done
          echo "no canned reply within 60s" >&2; exit 1

      - name: Verify is idempotent against the running stack
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-bootstrap
          CSUITE_AUTH_CONFIG_PATH: ${{ runner.temp }}/csuite-bootstrap/auth.json
          CSUITE_PORT: 8719
        run: scripts/bootstrap.sh verify </dev/null

      - name: Stop the broker
        if: always()
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-bootstrap
        run: scripts/bootstrap.sh down

  service:
    # install-service end to end with the stub verb: real systemd (PID 1
    # on ubuntu-latest), real passwordless sudo, real broker liveness.
    # Exercises the part-2 review bar: systemd-analyze verify on the
    # installed unit, reinstall over the root-0440 sudoers (the
    # privileged snapshot path), cycle via the scoped rule, and a
    # teardown that proves no surviving process.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Broker up with an enrolled runner member (default auth store)
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-service
          CSUITE_PORT: 8723
        run: scripts/bootstrap.sh up </dev/null

      - name: install-service (stub) — unit, sudoers, broker-observed liveness
        env:
          CSUITE_PORT: 8723
        run: |
          cd "${{ runner.temp }}/csuite-service/runner"
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" stub install-service --url http://127.0.0.1:8723 --timeout 90 \
            || { echo "::group::journalctl -u csuite-$(id -un)"; sudo journalctl -u "csuite-$(id -un)" --no-pager | tail -60; echo "::endgroup::"; exit 2; }
          systemd-analyze verify "/etc/systemd/system/csuite-$(id -un).service"
          echo "unit verified"
          sudo test "$(stat -c %a "/etc/sudoers.d/$(id -un)-csuite-runner")" = 440
          echo "sudoers installed at 0440"

      - name: Reinstall over the live service (root-0440 snapshot path)
        env:
          CSUITE_PORT: 8723
        run: |
          cd "${{ runner.temp }}/csuite-service/runner"
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" stub install-service --url http://127.0.0.1:8723 --timeout 90 | tee reinstall.out \
            || { echo "::group::journalctl -u csuite-$(id -un)"; sudo journalctl -u "csuite-$(id -un)" --no-pager | tail -60; echo "::endgroup::"; exit 2; }
          grep -q "replaced the previous install" reinstall.out

      - name: cycle — detached worker restarts the unit, liveness at the broker
        env:
          CSUITE_PORT: 8723
        run: |
          cd "${{ runner.temp }}/csuite-service/runner"
          LOG="$HOME/.local/var/csuite-cycle.log"
          # Invocation-scoped log: an append-only file must not let an
          # old success bless a new failure.
          : > "$LOG" || true
          node "$GITHUB_WORKSPACE/packages/cli/dist/index.js" stub cycle --url http://127.0.0.1:8723 --timeout 90
          for i in $(seq 1 60); do
            if grep -qE "✓ cycled|failed|never showed" "$LOG" 2>/dev/null; then break; fi
            sleep 2
          done
          cat "$LOG"
          grep -q "✓ cycled" "$LOG"
          ! grep -qE "failed|never showed" "$LOG"

      - name: Teardown — nothing survives
        if: always()
        env:
          CSUITE_BOOTSTRAP_DIR: ${{ runner.temp }}/csuite-service
        run: |
          UNIT="csuite-$(id -un)"
          sudo systemctl disable --now "$UNIT" || true
          sudo rm -f "/etc/systemd/system/$UNIT.service" "/etc/sudoers.d/$(id -un)-csuite-runner"
          sudo systemctl daemon-reload
          scripts/bootstrap.sh down || true
          if pgrep -af "dist/index.js stub" | grep -v "bash -c"; then
            echo "leaked stub process" >&2; exit 1
          fi
          echo "teardown clean"
