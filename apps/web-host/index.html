<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%HELM_SURFACE%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>CommandSuite</title>
    <meta name="description" content="CommandSuite — self-hosted agent control plane." />
    <script>
      // Pre-paint theme: helm (dark) is the :root default in the brand
      // tokens, so a light-preferring viewer would flash dark for the
      // instant before initTheme() runs in the module graph. Apply
      // helm-light synchronously from the same storage contract
      // lib/theme.ts owns.
      (() => {
        try {
          const mode = localStorage.getItem('csuite:theme');
          const light =
            mode === 'light' ||
            (mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.setAttribute('data-ef-theme', 'helm-light');
        } catch {}
      })();
    </script>
    <!--
      Font loading. Rajdhani (display), Outfit (body), and JetBrains
      Mono (mono) are @imported via @the-efficacious/brand/fonts.css in
      the shell stylesheet. The preconnect hints here just shave the
      initial RTT on first paint.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
